[project]
name = "edgeforge-backend"
version = "0.1.0"
description = "HowNik's EdgeForge - TinyML/Edge-AI Engineering IDE Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "pyserial>=3.5",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "onnx>=1.14.0",
    "skl2onnx>=1.16.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
tensorflow = ["tflite-runtime>=2.14.0"]
xgboost = ["xgboost>=2.0.0", "lightgbm>=4.0.0"]
all = [
    "torch>=2.0.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
]
